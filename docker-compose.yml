version: '3.8'

services:
  mlflow_server:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns --allowed-hosts "*"
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS="*"
    restart: on-failure

  fl_server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: fl_server
    depends_on:
      - mlflow_server
    volumes:
      - ./mlruns:/mlruns
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
    ports:
      - "8080:8080"
    restart: on-failure

  client_1:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: client_1
    depends_on:
      - fl_server
    volumes:
      - ./dataset:/app/dataset
    environment:
      - SERVER_ADDRESS=fl_server:8080
      - DATASET_PATH=/app/data/processed/heart_disease_hungary_cleaned.csv
      - CLIENT_ID=client_1
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
    command: python -m src.client.client
    restart: on-failure

  client_2:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: client_2
    depends_on:
      - fl_server
    volumes:
      - ./dataset:/app/dataset
    environment:
      - SERVER_ADDRESS=fl_server:8080
      - DATASET_PATH=/app/data/processed/heart_disease_switzerland_cleaned.csv
      - CLIENT_ID=client_2
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
    command: python -m src.client.client
    restart: on-failure
