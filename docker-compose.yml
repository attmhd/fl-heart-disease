services:
  mlflow_server:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns --allowed-hosts "*"
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS="*"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 5000))"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: on-failure
    networks:
      - fl_network

  fl_server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: fl_server
    depends_on:
      mlflow_server:
        condition: service_healthy
    volumes:
      - ./mlruns:/mlruns
      - ./data:/app/data
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
      - SERVER_DATASET_PATH=/app/data/processed/heart_disease_hungary_cleaned.csv
      - GIT_PYTHON_REFRESH=quiet
      - FL_NUM_ROUNDS
      - FL_FRACTION_FIT
      - FL_FRACTION_EVALUATE
      - FL_MIN_FIT_CLIENTS
      - FL_MIN_EVALUATE_CLIENTS
      - MODEL_MAX_ITER
      - MODEL_SOLVER
      - MODEL_C
      - MODEL_PENALTY
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8080))"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: on-failure
    networks:
      - fl_network

  client_1:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: client_1
    depends_on:
      fl_server:
        condition: service_healthy
    volumes:
      - ./mlruns:/mlruns
      - ./data:/app/data
    environment:
      - SERVER_ADDRESS=fl_server:8080
      - DATASET_PATH=/app/data/processed/heart_disease_hungary_cleaned.csv
      - CLIENT_ID=client_1
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
      - GIT_PYTHON_REFRESH=quiet
      - MODEL_MAX_ITER
      - MODEL_SOLVER
      - MODEL_C
      - MODEL_PENALTY
    command: python -m src.client.client
    restart: on-failure
    networks:
      - fl_network

  client_2:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: client_2
    depends_on:
      fl_server:
        condition: service_healthy
    volumes:
      - ./mlruns:/mlruns
      - ./data:/app/data
    environment:
      - SERVER_ADDRESS=fl_server:8080
      - DATASET_PATH=/app/data/processed/heart_disease_switzerland_cleaned.csv
      - CLIENT_ID=client_2
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
      - GIT_PYTHON_REFRESH=quiet
      - MODEL_MAX_ITER
      - MODEL_SOLVER
      - MODEL_C
      - MODEL_PENALTY
    command: python -m src.client.client
    restart: on-failure
    networks:
      - fl_network

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: on-failure
    networks:
      - fl_network

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    user: root
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    restart: on-failure
    depends_on:
      - loki
    networks:
      - fl_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: on-failure
    depends_on:
      - loki
    networks:
      - fl_network

volumes:
  loki_data:
  grafana_data:

networks:
  fl_network:
    driver: bridge
