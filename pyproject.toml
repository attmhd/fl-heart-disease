[project]
name = "heart-disease-fl"
version = "0.1.0"
description = "Thesis Project : Experiment Tracking and Model Registry on Heart Disease Classification using MLflow and Flower"
authors = [
    { name = "Muhammad Attan", email = "2022610013.attan@itp.ac.id" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flwr>=1.29.0",
    "mlflow>=3.12.0",
    "scikit-learn>=1.8.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "dvc[s3]>=3.67.1",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]


[tool.ruff]
src = ["src", "tests"]
line-length = 250
exclude = [
    ".venv",
    "__pycache__",
    ".ruff_cache",
    "build",
    "dist",
    "htmlcov",
    "node_modules",
    "mlruns",
    "venv",
    "notebook",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
extend-select = ["PLR", "PLW"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.black]
line-length = 250
target-version = ["py311"]
skip-string-normalization = true
